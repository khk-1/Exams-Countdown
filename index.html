<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عداد الايتي | لوحة الاختبارات</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap');

:root{
  --bg:#f7f9fc;
  --bg2:#eef4ff;
  --card:rgba(255,255,255,.78);
  --card-solid:#fff;
  --border:rgba(15,23,42,.08);
  --border-strong:rgba(79,70,229,.18);
  --accent:#5b5ce2;
  --accent2:#7c83ff;
  --accent-soft:#eef0ff;
  --text:#172033;
  --text2:#64748b;
  --text3:#94a3b8;
  --success:#10b981;
  --danger:#ef5b6b;
  --shadow:0 18px 55px rgba(49,65,100,.10);
  --shadow-hover:0 24px 70px rgba(49,65,100,.16);
}

.dark{
  --bg:#0b1020;
  --bg2:#111a31;
  --card:rgba(20,29,51,.72);
  --card-solid:#141d33;
  --border:rgba(255,255,255,.08);
  --border-strong:rgba(124,131,255,.28);
  --accent:#818cf8;
  --accent2:#a5b4fc;
  --accent-soft:rgba(129,140,248,.12);
  --text:#f8fafc;
  --text2:#b7c1d4;
  --text3:#8290a8;
  --shadow:0 22px 60px rgba(0,0,0,.28);
  --shadow-hover:0 28px 80px rgba(0,0,0,.38);
}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}

body{
  font-family:'IBM Plex Sans Arabic',sans-serif;
  min-height:100vh;
  color:var(--text);
  background:
    radial-gradient(circle at 8% 5%, rgba(124,131,255,.18), transparent 30%),
    radial-gradient(circle at 92% 18%, rgba(56,189,248,.13), transparent 27%),
    linear-gradient(145deg,var(--bg),var(--bg2));
  transition:.35s ease;
  overflow-x:hidden;
  padding-bottom:150px;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
    linear-gradient(rgba(100,116,139,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(100,116,139,.035) 1px,transparent 1px);
  background-size:34px 34px;
  mask-image:linear-gradient(to bottom,black,transparent 85%);
}

.container{
  width:min(1120px,calc(100% - 32px));
  margin:auto;
  padding:34px 0 20px;
  position:relative;
  z-index:2;
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 20px;
  margin-bottom:30px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:24px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  position:sticky;
  top:16px;
  z-index:20;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:1.55rem;
  font-weight:700;
  letter-spacing:-.5px;
}

.logo::before{
  content:"📚";
  width:42px;height:42px;
  display:grid;place-items:center;
  border-radius:14px;
  background:linear-gradient(135deg,var(--accent),#38bdf8);
  box-shadow:0 10px 25px rgba(91,92,226,.22);
  font-size:21px;
}

.logo span{
  color:var(--accent);
  background:none;
  -webkit-text-fill-color:initial;
}

.theme-btn{
  width:46px;height:46px;
  border:1px solid var(--border);
  border-radius:15px;
  background:var(--card-solid);
  color:var(--text);
  font-size:19px;
  cursor:pointer;
  transition:.25s ease;
  box-shadow:0 7px 20px rgba(15,23,42,.07);
}
.theme-btn:hover{transform:translateY(-2px) rotate(5deg);border-color:var(--border-strong)}

.header-actions{
  display:flex;
  align-items:center;
  gap:10px;
}
.term-badge{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:10px 14px;
  border-radius:14px;
  background:var(--accent-soft);
  border:1px solid var(--border-strong);
  color:var(--accent);
  font-size:12px;
  font-weight:700;
}

.section-title{
  margin:34px 0 17px;
  display:flex;
  align-items:center;
  gap:12px;
  font-size:1.18rem;
  font-weight:700;
  color:var(--text);
}

.section-title::after{
  content:"";
  height:1px;
  flex:1;
  background:linear-gradient(90deg,var(--border-strong),transparent);
}

.subjects-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(310px,1fr));
  gap:18px;
}

.empty-state{
  grid-column:1/-1;
  padding:34px 20px;
  text-align:center;
  color:var(--text2);
  background:var(--card);
  border:1px dashed var(--border-strong);
  border-radius:22px;
}

.subject-card{
  position:relative;
  overflow:hidden;
  min-height:235px;
  padding:22px;
  border:1px solid var(--border);
  border-radius:24px;
  background:var(--card);
  box-shadow:var(--shadow);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  transition:transform .3s ease,box-shadow .3s ease,border-color .3s ease;
}

.subject-card::before{
  content:"";
  position:absolute;
  inset:0 0 auto 0;
  height:4px;
  background:linear-gradient(90deg,var(--accent),#38bdf8);
  opacity:.9;
}

.subject-card::after{
  content:"";
  position:absolute;
  width:180px;height:180px;
  top:-90px;left:-70px;
  border-radius:50%;
  background:rgba(124,131,255,.09);
  filter:blur(10px);
  pointer-events:none;
}

.subject-card:hover{
  transform:translateY(-6px);
  box-shadow:var(--shadow-hover);
  border-color:var(--border-strong);
}

.subject-card.urgent{
  border-color:rgba(239,91,107,.3);
}
.subject-card.urgent::before{
  background:linear-gradient(90deg,#ef5b6b,#fb923c);
  animation:pulse 1.5s ease-in-out infinite alternate;
}
@keyframes pulse{to{opacity:.55}}

.card-top{position:relative;z-index:2;margin-bottom:20px}

.subject-code{
  display:inline-flex;
  align-items:center;
  padding:6px 11px;
  margin-bottom:13px;
  border-radius:10px;
  color:var(--accent);
  background:var(--accent-soft);
  border:1px solid var(--border-strong);
  font-size:11px;
  font-weight:700;
  letter-spacing:.5px;
}

.subject-name{
  font-size:1.12rem;
  font-weight:700;
  line-height:1.5;
  margin-bottom:8px;
}

.subject-date{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:7px;
  color:var(--text2);
  font-size:12px;
}
.subject-date .dot{
  width:4px;height:4px;
  border-radius:50%;
  background:var(--text3);
}

.countdown-display{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  position:relative;
  z-index:3;
}

.time-block{
  padding:13px 5px 10px;
  border-radius:16px;
  text-align:center;
  background:rgba(100,116,139,.055);
  border:1px solid var(--border);
  transition:.25s ease;
}
.subject-card:hover .time-block{
  background:var(--accent-soft);
  border-color:var(--border-strong);
}
.time-num{
  display:block;
  font-size:23px;
  font-weight:700;
  line-height:1.1;
  font-variant-numeric:tabular-nums;
}
.time-label{
  display:block;
  margin-top:5px;
  font-size:9px;
  color:var(--text3);
  font-weight:600;
}

.confetti-area{display:none;position:relative;z-index:4}
.subject-card.finished .countdown-display{display:none}
.subject-card.finished .subject-date{display:none}
.subject-card.finished .confetti-area{display:block;margin-top:12px}

.confetti-btn{
  width:100%;
  border:1px solid rgba(16,185,129,.25);
  border-radius:18px;
  padding:17px;
  cursor:pointer;
  font-family:inherit;
  background:rgba(16,185,129,.08);
  color:var(--success);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  transition:.25s ease;
}
.confetti-btn:hover{transform:translateY(-2px);background:rgba(16,185,129,.13)}
.confetti-btn .cb-emoji{font-size:27px}
.confetti-btn .cb-text{font-size:12px;font-weight:700}

#confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:1000}

.holiday-overlay{
  position:fixed;inset:0;z-index:997;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:25px;
  background:rgba(11,16,32,.72);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
}
.holiday-overlay.show{display:flex}
.holiday-text{
  max-width:850px;
  font-size:clamp(2.8rem,8vw,6rem);
  font-weight:700;
  line-height:1.2;
  color:#fff;
  text-shadow:0 15px 45px rgba(0,0,0,.25);
  animation:float 3s ease-in-out infinite alternate;
}
@keyframes float{to{transform:translateY(-12px)}}

.dashboard-hero::before{
  content:"";
  position:absolute;
  width:300px;height:300px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:50%;
  right:-110px;top:-130px;
}
.dashboard-hero::after{
  content:"";
  position:absolute;
  width:170px;height:170px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:50%;
  right:80px;bottom:-110px;
}

.hero-copy{position:relative;z-index:2;max-width:720px}
.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:7px 12px;
  margin-bottom:15px;
  border-radius:999px;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.16);
  font-size:11px;
  font-weight:600;
  backdrop-filter:blur(12px);
}
.eyebrow-dot{width:7px;height:7px;border-radius:50%;background:#6ee7b7;box-shadow:0 0 12px #6ee7b7}
.dashboard-hero h1{
  font-size:clamp(1.9rem,4vw,3rem);
  line-height:1.2;
  letter-spacing:-1px;
  margin-bottom:12px;
}
.dashboard-hero h1 span{display:block;color:#c7d2fe}
.dashboard-hero p{color:rgba(255,255,255,.78);font-size:13px;line-height:1.9;max-width:620px}
.hero-orb{
  position:relative;
  z-index:2;
  flex:none;
  width:130px;height:130px;
  display:grid;place-items:center;
  border-radius:38px;
  font-size:58px;
  background:rgba(255,255,255,.11);
  border:1px solid rgba(255,255,255,.18);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.25),0 20px 45px rgba(0,0,0,.12);
  backdrop-filter:blur(15px);
  transform:rotate(4deg);
}

@media(max-width:800px){
  .dashboard-hero{padding:30px 25px}
  .hero-orb{width:95px;height:95px;font-size:43px}
}
@media(max-width:520px){
  .dashboard-hero{min-height:220px;padding:25px 20px}
  .hero-orb{display:none}
}

@media(max-width:650px){
  .container{width:min(100% - 20px,1120px);padding-top:15px}
  header{position:relative;top:0;padding:14px 15px;border-radius:20px}
  .logo{font-size:1.25rem}
  .logo::before{width:38px;height:38px;border-radius:12px}
  .subjects-grid{grid-template-columns:1fr;gap:14px}
  .subject-card{min-height:220px;padding:19px}
  .section-title{margin-top:27px}
}

.term-section-badge{
  display:inline-flex;
  align-items:center;
  padding:5px 9px;
  border-radius:9px;
  margin-right:3px;
  font-size:10px;
  color:var(--accent);
  background:var(--accent-soft);
  border:1px solid var(--border-strong);
}


.extra-title{
  margin-top:42px;
  padding-top:8px;
  border-top:1px solid var(--border);
}
.extra-badge{
  color:#10b981;
  background:rgba(16,185,129,.10);
  border-color:rgba(16,185,129,.20);
}

</style>

</head>
<body>
<canvas id="confetti-canvas"></canvas>
<div class="holiday-overlay" id="holiday-overlay">
  <div class="holiday-text">إجازة سعيدة والوعد الـ A+ 🎊</div>
</div>
<div class="container">
  <header>
    <div class="logo">عداد <span>الـ IT</span></div>
    <div class="header-actions">
      <div class="term-badge">🎓 ترم 481</div>
      <button class="theme-btn" onclick="toggleTheme()" id="theme-btn" aria-label="تبديل الثيم">🌙</button>
    </div>
  </header>

  <section class="dashboard-hero">
    <div class="hero-copy">
      <div class="eyebrow"><span class="eyebrow-dot"></span> RA • الله يوفقنا</div>
      <h1>مستعد للاختبارات؟ <span>خلّنا نجيب الـ A+ 🎯</span></h1>
      <p>كل اختباراتك في مكان واحد، مع عدّاد مباشر لأقرب اختبار ونظرة سريعة على تقدمك.</p>
    </div>
    <div class="hero-orb">💻</div>
  </section>
<!-- قسم اختبارات المنتصف (Midterm) -->
  <div class="section-title">📝 Midterm Exams</div>
  <div class="subjects-grid" id="midterm-grid"></div>

  <!-- المواد الأساسية -->
  <div class="section-title">🎓 Final Exams <span class="term-section-badge">ترم 481</span></div>
  <div class="subjects-grid" id="final-grid"></div>

  <!-- المواد التي تمت إضافتها لاحقًا -->
  <div class="section-title extra-title">📚 مواد إضافية <span class="term-section-badge extra-badge">ترم 481</span></div>
  <div class="subjects-grid" id="extra-grid"></div>
</div>

<script>
const MIDTERM_EXAMS = [];

const FINAL_EXAMS = [
  { code: 'IT 401', name: 'تشفير', dateISO: '2026-12-27', time: '08:00', ampm: 'ص', day: 'الأحد' },
  { code: 'IT 402', name: 'لاسلكية', dateISO: '2026-12-30', time: '08:00', ampm: 'ص', day: 'الأربعاء' },
  { code: 'IT 403', name: 'ضغط البيانات', dateISO: '2027-01-04', time: '08:00', ampm: 'ص', day: 'الإثنين' },
  { code: 'IT 424', name: 'تطبيقات', dateISO: '2026-12-28', time: '10:30', ampm: 'ص', day: 'الاثنين' },
  { code: 'IT 405', name: 'نظم التجارة الإلكترونية', dateISO: '2026-12-23', time: '08:00', ampm: 'ص', day: 'الاربعاء' }
];

const EXTRA_EXAMS = [
  { code: '481-01', name: 'سلم', dateISO: '2026-12-21', hijriDate: '1448/7/12', time: '08:00', timeRange: '08:00 - 10:00 ص', ampm: 'ص', day: 'الإثنين' },
  { code: '481-02', name: 'سيرة', dateISO: '2026-12-23', hijriDate: '1448/7/14', time: '10:30', timeRange: '10:30 ص - 12:30 م', ampm: 'ص', day: 'الأربعاء' },
  { code: '481-03', name: 'الأسرة', dateISO: '2026-12-24', hijriDate: '1448/7/15', time: '13:00', timeRange: '01:00 م - 03:00 م', ampm: 'م', day: 'الخميس' },
  { code: '481-04', name: 'نظام', dateISO: '2026-12-27', hijriDate: '1448/7/18', time: '13:00', timeRange: '01:00 م - 03:00 م', ampm: 'م', day: 'الأحد' },
  { code: '481-06', name: 'سرية', dateISO: '2026-12-30', hijriDate: '1448/7/21', time: '13:00', timeRange: '01:00 م - 03:00 م', ampm: 'م', day: 'الأربعاء' },
  { code: '481-05', name: 'تراكيب', dateISO: '2027-01-03', hijriDate: '1448/7/25', time: '08:00', timeRange: '08:00 - 10:00 ص', ampm: 'ص', day: 'الأحد' },
  { code: '481-07', name: 'تحليل', dateISO: '2027-01-06', hijriDate: '1448/7/28', time: '10:30', timeRange: '10:30 ص - 12:30 م', ampm: 'ص', day: 'الأربعاء' }
];

const ONE_HOUR = 3600000;

let isLight = localStorage.getItem('theme') !== 'dark';
if (isLight) document.documentElement.classList.remove('dark'); else document.documentElement.classList.add('dark');
document.getElementById('theme-btn').textContent = isLight ? '☀️' : '🌙';

function to12hr(time, ampm) {
  const [h, m] = time.split(':').map(Number);
  const h12 = h === 0 ? 12 : h > 12 ? h - 12 : h;
  return `${String(h12).padStart(2,'0')}:${String(m).padStart(2,'0')} ${ampm}`;
}

function examFinished(s) {
  const examDate = new Date(s.dateISO + 'T' + s.time + ':00').getTime();
  return (Date.now() - examDate) >= ONE_HOUR;
}


function sortExamsByDate(exams){
  return [...exams].sort((a,b) =>
    new Date(a.dateISO + 'T' + a.time + ':00') -
    new Date(b.dateISO + 'T' + b.time + ':00')
  );
}

function buildGridHTML(subjects, prefix) {
  subjects = sortExamsByDate(subjects);
  if (subjects.length === 0) {
    return `<div class="empty-state">لا توجد اختبارات مضافة حالياً في هذا القسم.</div>`;
  }
  return subjects.map((s, i) => {
    const finished = examFinished(s);
    const examDate = new Date(s.dateISO + 'T' + s.time + ':00').getTime();
    const diff = examDate - Date.now();
    const urgent = !finished && diff > 0 && diff < 86400000 * 2;
    const colorIdx = i % 6;

    return `<div class="subject-card${finished?' finished':''}${urgent?' urgent':''}" data-idx="${colorIdx}" id="${prefix}-card-${i}">
      <div class="card-top">
        <span class="subject-code">${s.code}</span>
        <div class="subject-name">${s.name}</div>
        <div class="subject-date">
          <span>${s.day}</span><span class="dot"></span><span>${s.hijriDate || s.dateISO}</span><span class="dot"></span>
          <span>${s.timeRange ? 'الساعة ' + s.timeRange : 'الساعة ' + to12hr(s.time, s.ampm)}</span>
        </div>
      </div>
      <div class="countdown-display">
        <div class="time-block"><span class="time-num" id="${prefix}-d-${i}">—</span><span class="time-label">يوم</span></div>
        <div class="time-block"><span class="time-num" id="${prefix}-h-${i}">—</span><span class="time-label">ساعة</span></div>
        <div class="time-block"><span class="time-num" id="${prefix}-m-${i}">—</span><span class="time-label">دقيقة</span></div>
        <div class="time-block"><span class="time-num" id="${prefix}-s-${i}">—</span><span class="time-label">ثانية</span></div>
      </div>
      <div class="confetti-area">
        <button class="confetti-btn" onclick="launchConfetti()">
          <span class="cb-emoji">🎉</span>
          <span class="cb-text">انتهى الاختبار! اضغط للاحتفال</span>
        </button>
      </div>
    </div>`;
  }).join('');
}

function renderSubjects() {
  document.getElementById('midterm-grid').innerHTML = buildGridHTML(MIDTERM_EXAMS, 'mid');
  document.getElementById('final-grid').innerHTML = buildGridHTML(FINAL_EXAMS, 'fin');
  document.getElementById('extra-grid').innerHTML = buildGridHTML(EXTRA_EXAMS, 'extra');
}

function updateSectionCountdowns(subjects, prefix) {
  subjects = sortExamsByDate(subjects);
  const now = Date.now();
  subjects.forEach((s, i) => {
    const card = document.getElementById(`${prefix}-card-${i}`);
    if (!card) return;

    if (examFinished(s)) {
      if (!card.classList.contains('finished')) {
        card.classList.add('finished');
        card.classList.remove('urgent');
        launchConfetti();
      }
      return;
    }

    const examMs = new Date(s.dateISO + 'T' + s.time + ':00').getTime();
    const diff = examMs - now;
    if (diff <= 0) return;

    const days  = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const mins  = Math.floor((diff % 3600000) / 60000);
    const secs  = Math.floor((diff % 60000) / 1000);
    const set = (id,v) => { const el=document.getElementById(id); if(el) el.textContent=String(v).padStart(2,'0'); };
    set(`${prefix}-d-${i}`, days);
    set(`${prefix}-h-${i}`, hours);
    set(`${prefix}-m-${i}`, mins);
    set(`${prefix}-s-${i}`, secs);
    card.classList.toggle('urgent', diff < 86400000 * 2);
  });
}

function updateCountdowns() {
  updateSectionCountdowns(MIDTERM_EXAMS, 'mid');
  updateSectionCountdowns(FINAL_EXAMS, 'fin');
  updateSectionCountdowns(EXTRA_EXAMS, 'extra');

  const allSubjects = [...MIDTERM_EXAMS, ...FINAL_EXAMS, ...EXTRA_EXAMS];
  if (allSubjects.length > 0) {
    const allDone = allSubjects.every((s) => examFinished(s));
    const overlay = document.getElementById('holiday-overlay');
    if (allDone && !overlay.classList.contains('show')) {
      overlay.classList.add('show');
      launchInfiniteConfetti();
    }
  }
}

function toggleTheme() {
  isLight = !isLight;
  document.documentElement.classList.toggle('dark', !isLight);
  localStorage.setItem('theme', isLight ? 'light' : 'dark');
  document.getElementById('theme-btn').textContent = isLight ? '☀️' : '🌙';
}

function launchConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const colors = ['#818cf8','#34d399','#60a5fa','#fb923c','#f472b6','#a78bfa'];
  const pieces = Array.from({length:180}, () => ({
    x: Math.random() * canvas.width,
    y: -10 - Math.random() * 120,
    r: Math.random() * 7 + 3,
    color: colors[Math.floor(Math.random() * colors.length)],
    vx: (Math.random() - 0.5) * 6,
    vy: Math.random() * 5 + 2,
    rot: Math.random() * 360,
    vrot: (Math.random() - 0.5) * 10,
    life: 1,
  }));
  let frame;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    pieces.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.12;
      p.rot += p.vrot; p.life -= 0.007;
      if (p.life <= 0 || p.y > canvas.height) return;
      alive = true;
      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.r/2, -p.r/2, p.r, p.r * 2.2);
      ctx.restore();
    });
    if (alive) frame = requestAnimationFrame(draw);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  cancelAnimationFrame(frame);
  draw();
}

function launchInfiniteConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const colors = ['#818cf8','#34d399','#60a5fa','#fb923c','#f472b6','#a78bfa'];
  let pieces = [];
  function addPieces() {
    for (let i = 0; i < 8; i++) {
      pieces.push({
        x: Math.random() * canvas.width, y: -10,
        r: Math.random() * 7 + 3,
        color: colors[Math.floor(Math.random() * colors.length)],
        vx: (Math.random() - 0.5) * 5,
        vy: Math.random() * 4 + 2,
        rot: Math.random() * 360,
        vrot: (Math.random() - 0.5) * 8,
        life: 1,
      });
    }
  }
  setInterval(addPieces, 200);
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces = pieces.filter(p => p.life > 0 && p.y < canvas.height);
    pieces.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.1;
      p.rot += p.vrot; p.life -= 0.005;
      ctx.save(); ctx.globalAlpha = p.life;
      ctx.translate(p.x, p.y); ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.r/2, -p.r/2, p.r, p.r * 2.2);
      ctx.restore();
    });
    requestAnimationFrame(draw);
  }
  draw();
}

renderSubjects();
updateCountdowns();
setInterval(updateCountdowns, 1000);
